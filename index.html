<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121419"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Toji Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: una columna tipo app móvil (máx 720px), navegación inferior fija, barra de temporizador sobre ella. Dark-first. */
:root{
  --bg:#121419; --surface:#1A1D24; --surface2:#232731; --line:#2E333E;
  --fg:#E6E3DC; --muted:#8E929C; --accent:#C9A45C; --accent-ink:#17120A;
  --good:#6FBF8E; --warn:#D9A441; --bad:#E0776B;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F2F1EE; --surface:#FFFFFF; --surface2:#E9E7E2; --line:#D6D3CB;
  --fg:#1B1D22; --muted:#666A73; --accent:#86651F; --accent-ink:#FFFFFF;
  --good:#2D7A4E; --warn:#8F640E; --bad:#B0443A; color-scheme:light }}
:root[data-theme="light"]{
  --bg:#F2F1EE; --surface:#FFFFFF; --surface2:#E9E7E2; --line:#D6D3CB;
  --fg:#1B1D22; --muted:#666A73; --accent:#86651F; --accent-ink:#FFFFFF;
  --good:#2D7A4E; --warn:#8F640E; --bad:#B0443A; color-scheme:light }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 150px}
#app{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0}
h1{font-size:30px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:19px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 10px}
.top .sub{font-size:13px}
#sync{white-space:nowrap;font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
#sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
#sync[data-s="sync"]::before{background:var(--good)}
#sync[data-s="err"]::before{background:var(--bad)}
section{display:grid;gap:12px;margin-block:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.tile .v{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .d{font-size:12px;color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);padding:9px 14px;min-height:40px}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn-g{background:transparent}
.btn-d{color:var(--bad);background:transparent}
.btn-s{min-height:32px;padding:5px 10px;font-size:13px}
.wide{width:100%}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-height:40px;width:100%}
textarea{min-height:70px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.good{color:var(--good);border-color:currentColor}
.chip.warn{color:var(--warn);border-color:currentColor}
.chip.acc{color:var(--accent);border-color:currentColor}
.empty{color:var(--muted);font-size:14px;margin:0;padding:10px 0}
/* segmented */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:34px;padding:5px 14px;background:transparent;font-family:var(--f-display);letter-spacing:.08em;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.scale{display:grid;grid-template-columns:90px repeat(5,minmax(0,1fr));gap:6px;align-items:center}
.scale button{min-height:36px;padding:0;font-family:var(--f-mono)}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:11px;min-width:0;background:var(--surface)}
.wd b{display:block;font-family:var(--f-display);font-size:15px;letter-spacing:.04em}
.wd .t{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wd.plan{border-style:dashed;border-color:var(--muted)}
.wd.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wd.done .t{color:var(--accent-ink)}
.wd.today{box-shadow:0 0 0 2px var(--fg) inset}
/* next workout */
.hero{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:16px;display:grid;gap:12px}
.hero h2{font-size:30px}
.plan-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.plan-list li{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.plan-list li>span:last-child{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.plan-list li.bh{border:0;padding:6px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.plan-list .sg{color:var(--accent)}
.warm{font-size:13px;color:var(--muted)}
/* active workout */
.wbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.wbar .row{flex-wrap:nowrap}
#clock{font-family:var(--f-mono);font-size:20px;font-weight:600}
#clock small{font-size:12px;color:var(--muted);font-weight:500}
#clock.over{color:var(--warn)}
.blk{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:6px;border-top:2px solid var(--accent)}
.blk h3{font-size:16px;text-transform:uppercase;letter-spacing:.08em}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.ex.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-h h3{color:var(--accent)}
.ex-meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.ex-meta .up{color:var(--accent);font-weight:600}
.sets{width:100%;border-collapse:collapse;font-size:14px}
.sets th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding:4px 2px}
.sets td{padding:3px 2px;text-align:center;vertical-align:middle}
.sets td.n{font-family:var(--f-mono);color:var(--muted);width:26px}
.sets td.p{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:70px}
.sets td.na{color:var(--muted)}
.sets input,.sets select{text-align:center;padding:6px 4px;min-height:38px;font-family:var(--f-mono)}
.sets select{padding-inline:0}
.sets tr.ok td{background:color-mix(in srgb,var(--good) 14%,transparent)}
.sets tr.ok td:first-child{border-radius:6px 0 0 6px}.sets tr.ok td:last-child{border-radius:0 6px 6px 0}
.chk{width:40px;min-height:38px;padding:0;font-weight:700}
tr.ok .chk{background:var(--good);border-color:var(--good);color:var(--bg)}
.pr{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.08em}
.sets-wrap{overflow-x:auto}
.check{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;min-height:0;flex:none}
/* timer bar */
#restbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:20;padding:0 16px}
#restbar .in{max-width:720px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
#restbar .in.work{background:var(--accent);color:var(--accent-ink)}
#restbar .fill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 45%,transparent);transition:width .25s linear}
#restbar .in.work .fill{background:color-mix(in srgb,var(--accent-ink) 18%,transparent)}
#restbar .in>*{position:relative}
#restT{font-family:var(--f-mono);font-size:22px;font-weight:600;min-width:62px}
#restbar button{background:transparent;color:inherit;border-color:currentColor;opacity:.85;min-height:34px;padding:4px 10px}
#restL{font-size:12px;font-weight:600;letter-spacing:.04em;flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;color:var(--muted);font-family:var(--f-display);font-size:14px;letter-spacing:.04em;text-transform:uppercase;min-height:44px;padding:6px 2px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--surface2)}
/* nutrition */
.meals{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.meal{text-align:left;display:grid;gap:2px;padding:8px 10px}
.meal b{font-weight:600;font-size:14px}
.meal span{font-size:12px;color:var(--muted)}
.meal[aria-pressed="true"]{background:color-mix(in srgb,var(--good) 18%,var(--surface));border-color:var(--good)}
.meter{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.met i{background:var(--good)}
/* history */
.month{margin-top:8px}
.hs{cursor:pointer;gap:6px}
.hs-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hs-top h3{font-size:18px}
.hs-body{display:grid;gap:4px;font-size:13px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.hs-body div{display:flex;justify-content:space-between;gap:10px}
.hs-body div span:last-child{font-family:var(--f-mono);color:var(--muted);text-align:right}
/* charts */
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch .gl{stroke:var(--line);stroke-width:1}
svg.ch text{fill:var(--muted);font-family:var(--f-mono);font-size:19px}
svg.ch .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
svg.ch .ar{fill:var(--accent);opacity:.12}
svg.ch .dt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
svg.ch .raw{fill:var(--muted);opacity:.6}
svg.ch .end{fill:var(--accent)}
svg.ch text.ev{fill:var(--fg);font-weight:600;font-size:21px}
svg.ch .br{fill:var(--accent);opacity:.35}
svg.ch .br.cur{opacity:1}
svg.ch .br.met{opacity:.8}
svg.ch .tg{stroke:var(--fg);stroke-dasharray:4 4;stroke-width:1;opacity:.6}
table.rec{width:100%;border-collapse:collapse;font-size:14px}
table.rec td{padding:7px 0;border-bottom:1px solid var(--line)}
table.rec td:last-child{text-align:right;font-family:var(--f-mono)}
/* modal & toast */
#modal{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 55%,transparent);display:flex;align-items:flex-end;justify-content:center;padding:16px}
#modal .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:520px;display:grid;gap:12px;max-height:85vh;overflow:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(124px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.tpl-ed textarea{font-family:var(--f-mono);font-size:12px;min-height:170px}
/* ---- v3: refinamiento visual ---- */
body{background:radial-gradient(120% 50% at 50% -8%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 62%) no-repeat,var(--bg)}
.top{align-items:center;padding-block:16px 6px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{width:38px;height:38px;flex:none}
.top .sub{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:54px;height:54px;flex:none}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--surface2)}
.ring .fgc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.card,.tile,.ex{border-radius:14px}
.card h3{font-size:20px}
.hero{border-left:0;border-top:3px solid var(--accent);border-radius:14px;padding:18px;box-shadow:0 10px 30px -18px color-mix(in srgb,var(--accent) 60%,transparent)}
.hero h2{font-size:36px;line-height:1}
.smap{display:flex;height:8px;gap:3px}
.smap i{display:block;border-radius:4px}
.smap i.m{background:var(--accent)}
.smap i.w,.smap i.c{background:color-mix(in srgb,var(--accent) 35%,var(--surface2))}
.smap-l{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);font-family:var(--f-mono);margin-top:4px}
.wd{border-radius:10px}
.spk{width:100%;height:28px;display:block;margin-top:8px}
.spk path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.spk path.a{fill:var(--accent);opacity:.14;stroke:none}
.wk8{display:flex;gap:3px;margin-top:10px}
.wk8 i{flex:1;height:8px;border-radius:2px;background:var(--surface2)}
.wk8 i.on{background:var(--accent)}
.todo{display:grid;gap:6px}
.td{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:50px;cursor:pointer;user-select:none}
.td:hover{border-color:var(--muted)}
.td:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.td .bx{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:var(--bg);font-size:13px;font-weight:700}
.td.on{background:color-mix(in srgb,var(--good) 10%,var(--bg));border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.td.on .bx{background:var(--good);border-color:var(--good)}
.td .tt{flex:1;min-width:0;font-size:14px}
.td.on .tt{color:var(--muted)}
.td .tt small{display:block;color:var(--muted);font-size:12px}
.td .tm{min-height:32px;padding:4px 10px;font-family:var(--f-mono);font-size:12px;flex:none}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:600;margin-top:6px}
.wbar{display:block}
.wbar .r1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pbar{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.steps{display:grid;gap:4px;margin-top:8px}
.steps button{min-height:34px;padding:4px;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;font-size:14px;background:transparent;color:var(--muted)}
.steps button[aria-current="step"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps button.dn{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.dots{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:5px}
.dots i{display:block;aspect-ratio:1;border-radius:50%;background:var(--surface2)}
.dots i.min{background:color-mix(in srgb,var(--good) 45%,var(--surface2))}
.dots i.full{background:var(--good)}
.dots i.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--fg)}
nav.tabs{backdrop-filter:blur(10px);background:color-mix(in srgb,var(--surface) 92%,transparent)}
nav.tabs button{display:grid;justify-items:center;gap:2px;font-size:12px;letter-spacing:.06em;padding:6px 2px 4px;border-radius:10px}
nav.tabs svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
@media (max-width:420px){.tile .v{font-size:18px}.sets td.p{width:54px;font-size:11px}h1{font-size:26px}.scale{grid-template-columns:78px repeat(5,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div id="app">
  <header class="top">
    <div class="brand"><svg class="logo" viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="10" style="fill:var(--surface2)"/><rect x="8" y="11" width="22" height="4.5" rx="1" style="fill:var(--accent)"/><rect x="16.75" y="11" width="4.5" height="17" rx="1" style="fill:var(--accent)"/></svg>
      <div style="min-width:0"><h1>Toji Tracker</h1><div class="sub muted"><span id="today"></span><span id="sync" data-s="local">Local</span></div></div></div>
    <div class="ring" title="Sesiones de esta semana"><svg viewBox="0 0 54 54" aria-hidden="true"><circle class="bgc" cx="27" cy="27" r="22"/><circle class="fgc" id="ringC" cx="27" cy="27" r="22" stroke-dasharray="138.2" stroke-dashoffset="138.2"/></svg><span id="ringT">0/4</span></div>
  </header>
  <main id="view"></main>
</div>
<div id="restbar" hidden></div>
<nav class="tabs" aria-label="Secciones"><div class="in">
  <button data-tab="hoy" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Hoy</button>
  <button data-tab="hist"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historial</button>
  <button data-tab="prog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M6 16v-5M11 16V6M16 16v-8M21 16v-3"/></svg>Progreso</button>
  <button data-tab="aj"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>Ajustes</button>
</div></nav>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);

const parseDay=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};

const chains={},timers={};
async function dbw(fn){try{await fn();setSync('sync')}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,700+Math.random()*900));try{await fn();setSync('sync');return}catch{}}if(e&&e.code==='quota_exceeded')toast('Almacenamiento lleno: exporta y borra sesiones antiguas.');else toast('No se pudo sincronizar. Quedó guardado en este dispositivo.');setSync('err')}}
function q(key,fn){if(!DB)return Promise.resolve();chains[key]=(chains[key]||Promise.resolve()).then(()=>dbw(fn));return chains[key]}
function later(key,ms,fn){clearTimeout(timers[key]);timers[key]=setTimeout(fn,ms)}
function saveSession(s){S.sessions=[...S.sessions.filter(x=>x.id!==s.id),s].sort(bySess);LS.set('sessions',S.sessions);q('s/'+s.id,()=>DB.collection('sessions').doc(s.id).set(s))}
function deleteSession(id){S.sessions=S.sessions.filter(x=>x.id!==id);LS.set('sessions',S.sessions);q('s/'+id,()=>DB.collection('sessions').doc(id).delete())}
function saveBody(e){S.body=[...S.body.filter(x=>x.date!==e.date),e].sort((a,b)=>a.date<b.date?-1:1);LS.set('body',S.body);q('b/'+e.date,()=>DB.collection('body').doc(e.date).set(e))}
function deleteBody(date){S.body=S.body.filter(x=>x.date!==date);LS.set('body',S.body);q('b/'+date,()=>DB.collection('body').doc(date).delete())}
function saveDaily(date){LS.set('daily',S.daily);const d=S.daily[date];later('d/'+date,800,()=>q('d/'+date,()=>DB.collection('daily').doc(date).set(d)))}
function saveConfig(){LS.set('templates',S.templates);LS.set('settings',S.settings);later('cfg',700,()=>q('cfg',()=>DB.doc('config/app').set({tplVer:TPL_VER,templates:S.templates,settings:S.settings})))}
function saveActive(now){LS.set('active',S.active);const go=()=>q('act',()=>S.active?DB.doc('state/active').set({w:S.active,t:Date.now()}):DB.doc('state/active').delete());if(now){clearTimeout(timers.act);go()}else later('act',1500,go)}

async function connect(){
  let db=null;
  try{if(window.claude&&window.claude.use)db=await window.claude.use('db')}catch{}
  if(!db){setSync('local');return}
  DB=db;
  try{
    const [ss,bb,cfg]=await Promise.all([db.collection('sessions').get(),db.collection('body').get(),db.doc('config/app').get()]);
    if(ss.empty&&S.sessions.length)for(const s of S.sessions)await db.collection('sessions').doc(s.id).set(s);
    if(bb.empty&&S.body.length)for(const e of S.body)await db.collection('body').doc(e.date).set(e);
    if(cfg.exists){const d=clone(cfg.data());if(d.settings)S.settings={...DEF_SET,...d.settings,start:d.settings.start||S.settings.start};if(d.templates&&(d.tplVer||1)>=2)S.templates=enrich(d.templates);LS.set('templates',S.templates);LS.set('settings',S.settings);if((d.tplVer||1)<TPL_VER||!d.settings||!d.settings.start)await db.doc('config/app').set({tplVer:TPL_VER,templates:S.templates,settings:S.settings})}
    else await db.doc('config/app').set({tplVer:TPL_VER,templates:S.templates,settings:S.settings});
    if(!S.active){const a=await db.doc('state/active').get();if(a.exists&&a.data().w){S.active=clone(a.data().w);LS.set('active',S.active);startWake()}}
    setSync('sync');
  }catch(e){setSync('err')}
  db.collection('sessions').onSnapshot(qs=>{S.sessions=qs.docs.map(d=>clone(d.data())).sort(bySess);LS.set('sessions',S.sessions);softRender()},()=>setSync('err'));
  db.collection('body').onSnapshot(qs=>{S.body=qs.docs.map(d=>clone(d.data())).sort((a,b)=>a.date<b.date?-1:1);LS.set('body',S.body);softRender()},()=>setSync('err'));
  db.collection('daily').onSnapshot(qs=>{const m={};qs.docs.forEach(d=>m[d.id]=clone(d.data()));const loc=S.daily;for(const k in loc)if(!m[k])q('d/'+k,()=>DB.collection('daily').doc(k).set(loc[k]));S.daily={...loc,...m};LS.set('daily',S.daily);softRender()},()=>setSync('err'));
  render();
}

/* ============ analítica ============ */
const kind=e=>e.x?'x':(e.u==='reps'&&!e.nk)?'load':'val';
const unitS=e=>e.u==='seg'?' s':e.u==='m'?' m':'';
const tgt=e=>e.amrap?'AMRAP':e.lo==null?(e.u==='seg'?'tiempo':'libre'):(e.lo===e.hi||e.hi==null?`${e.lo}`:`${e.lo}–${e.hi}`)+unitS(e)+(e.side?'/lado':'');
function progWeek(){const a=weekStart(parseDay(S.settings.start||todayISO())),b=weekStart(new Date());return Math.max(1,Math.round((b-a)/(7*864e5))+1)}
const PHASE=w=>w===1?'RPE conservador':w===2?'Ajusta cargas si fue fácil':'Sube densidad: +1–2 reps o +5 %';
function bwOn(date){let v=null;for(const e of S.body){if(e.date<=date)v=e.kg;else break}return v??S.settings.bw}
const load=(e,s,bw)=>e.b?bw+(s.kg||0):(s.kg||0);
function lastPerf(name,before=Infinity){for(let i=S.sessions.length-1;i>=0;i--){const s=S.sessions[i];if(s.start>=before)continue;const e=s.ex.find(x=>x.n===name);if(e)return{sess:s,e}}return null}
function history(name){const out=[];for(const s of S.sessions){const e=s.ex.find(x=>x.n===name);if(e)out.push({s,e})}return out}
function bestOf(name,before=Infinity){const b={e1:0,kg:0,val:null,xv:0,vol:0,n:0};for(const{s,e}of history(name)){if(s.start>=before)continue;b.n++;const bw=s.bw??S.settings.bw;const k=kind(e);let vol=0;for(const st of e.sets){if(k==='load'){const L=load(e,st,bw);b.e1=Math.max(b.e1,e1rm(L,st.r));b.kg=Math.max(b.kg,L);vol+=Math.max(0,st.kg||0)*st.r}else if(k==='x')b.xv=Math.max(b.xv,st.kg||0);else b.val=b.val==null?st.r:(e.low?Math.min(b.val,st.r):Math.max(b.val,st.r))}b.vol=Math.max(b.vol,vol)}return b}
function sessVol(s){let v=0;for(const e of s.ex)if(kind(e)==='load')for(const st of e.sets)v+=Math.max(0,st.kg||0)*(st.r||0);return v}
function suggest(d){
  const wk=progWeek(),tr=d.rpe||7,lp=lastPerf(d.n),k=kind(d);
  if(k!=='load'){
    if(!lp)return{kg:null,note:wk===1?'Semana 1: técnica y control, sin fallo':'Primera marca: regístrala',tone:''};
    const vals=lp.e.sets.map(s=>s.r);const best=d.low?Math.min(...vals):Math.max(...vals);
    const top=k==='x'?Math.max(...lp.e.sets.map(s=>s.kg||0)):null;
    if(d.amrap)return{kg:null,note:`AMRAP · anterior ${vals.reduce((a,b)=>a+b,0)} reps totales, supéralo`,tone:''};
    return{kg:top||null,note:`Anterior ${d.low?'mejor':'máx'} ${best}${unitS(d)} · ${d.low?'bájalo':'supéralo'}`,tone:''};
  }
  if(!lp)return{kg:null,note:wk===1?`Semana 1: arranca liviano, RPE ≤ ${Math.min(tr,7)}`:`Primera vez: busca RPE ${tr}`,tone:''};
  const sets=lp.e.sets,top=Math.max(...sets.map(s=>s.kg||0));
  const w=sets.filter(s=>(s.kg||0)===top),rp=w.map(s=>s.rpe).filter(x=>x!=null);
  const rpe=rp.length?rp.reduce((a,b)=>a+b,0)/rp.length:null;
  const up=d.b?r1(top+(d.inc||2.5)):Math.max(top+(d.inc||2.5),round25(top*1.05));
  const hi=d.hi??d.lo,lo=d.lo;
  const allHi=w.every(s=>s.r>=hi),miss=lo!=null&&w.some(s=>s.r<lo);
  if(wk===1)return{kg:top||null,note:`Semana 1: misma carga, RPE ≤ ${Math.min(tr,7)}`,tone:'hold'};
  if(wk===2){if(rpe!=null&&rpe<=tr-1)return{kg:up,note:`Fue fácil (RPE ${fmt(rpe)}) → ${d.b?'+'+fmt(d.inc||2.5)+' kg':'+5 %'}`,tone:'up'};return{kg:top||null,note:'Semana 2: sube solo si fue fácil (anota RPE)',tone:''}}
  if(allHi&&(rpe==null||rpe<=tr+.5))return{kg:up,note:`Tope de ${hi} cumplido → ${d.b?'+'+fmt(d.inc||2.5)+' kg':'+5 %'} y vuelve a ${lo}`,tone:'up'};
  if(miss)return{kg:top||null,note:`Repite carga · faltó llegar a ${lo}`,tone:'hold'};
  if(rpe!=null&&rpe>=9.5)return{kg:top||null,note:'Repite carga · RPE muy alto',tone:'hold'};
  return{kg:top||null,note:`Misma carga · +1–2 reps (tope ${hi})`,tone:''};
}
function weekCounts(n){const ws=weekStart(new Date());const out=[];for(let i=n-1;i>=0;i--){const a=new Date(ws);a.setDate(a.getDate()-7*i);const b=new Date(a);b.setDate(b.getDate()+7);const A=isoDay(a),B=isoDay(b);const ss=S.sessions.filter(s=>s.date>=A&&s.date<B);out.push({start:a,count:new Set(ss.map(s=>s.date)).size,vol:ss.reduce((t,s)=>t+(s.vol??sessVol(s)),0),cur:i===0})}return out}
function streak(){const w=weekCounts(52);let k=0;if(w[w.length-1].count>=S.settings.min)k++;for(let i=w.length-2;i>=0;i--){if(w[i].count>=S.settings.min)k++;else break}return k}
const dayDoc=d=>S.daily[d]||{m:[],cr:false,ag:false};
const protOf=d=>{const doc=dayDoc(d);return S.settings.meals.reduce((t,m,i)=>t+(doc.m.includes(i)?m.g:0),0)+(doc.x||0)};

/* ============ gráficos ============ */
function ticks(a,b,n){const st0=(b-a)/n||1;const mag=10**Math.floor(Math.log10(st0));const st=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=st0);const out=[];for(let v=Math.floor(a/st)*st;;v+=st){out.push(+v.toFixed(3));if(v>=b-1e-9)break}return out}
function lineChart(pts,{avg=null,h=260}={}){
  if(pts.length<2)return `<p class="empty">Con 2 registros o más aparece la curva.</p>`;
  const W=640,H=h,L=70,R=80,T=18,B=38;
  const all=pts.map(p=>p.y).concat(avg?avg.map(p=>p.y):[]);
  let lo=Math.min(...all),hi=Math.max(...all);const pd=(hi-lo)*.12||1;
  const tk=ticks(lo-pd,hi+pd,4);lo=tk[0];hi=tk[tk.length-1];
  const x0=pts[0].x,x1=pts[pts.length-1].x;
  const X_=x=>L+(x-x0)/((x1-x0)||1)*(W-L-R),Y=y=>T+(1-(y-lo)/((hi-lo)||1))*(H-T-B);
  const main=avg||pts;
  const g=tk.map(t=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-10}" y="${Y(t)+7}" text-anchor="end">${fmt(t)}</text>`).join('');
  const d=main.map((p,i)=>`${i?'L':'M'}${X_(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area=`${d}L${X_(main[main.length-1].x)},${H-B}L${X_(main[0].x)},${H-B}Z`;
  const raw=pts.map(p=>`<circle class="${avg?'raw':'dt'}" cx="${X_(p.x)}" cy="${Y(p.y)}" r="${avg?3:3.5}"/>`).join('');
  const e=main[main.length-1];

function barChart(items,{target=null,fmtV=v=>v,h=230}={}){

  const t=e.find(([k,v])=>v.day===dow);if(t)nx={key:t[0],when:'Toca hoy'};
  else for(let i=1;i<7&&!nx;i++){const n=e.find(([k,v])=>v.day===(dow+i)%7);if(n)nx={key:n[0],when:i===1?'Próxima · mañana':`Próxima · ${DIA[(dow+i)%7]}`}}
  if(!nx)nx={key:e[0][0],when:'Sesión'};
  const orig=S.templates[nx.key];
  if(S.settings.place==='casa'&&orig.place!=='casa'){const alt=e.find(([k,v])=>v.place==='casa'&&v.day==null);if(alt)return{...nx,key:alt[0],swapped:orig.name}}

}
function planRows(t){let out='',blk=null;for(const d of t.ex){if(d.c&&d.c!==blk){blk=d.c;const b=(t.blocks||{})[blk];if(b)out+=`<li class="bh"><span>${esc(b.label)}</span><span>${b.rounds?`${b.rounds} rondas${b.work?` · ${b.work}/${b.off} s`:''}${b.rest?` · ${b.rest} s entre rondas`:''}`:''}</span></li>`}
  const sg=suggest(d);const kg=sg.kg!=null&&!d.nk?`${d.x?fmt(sg.kg)+' '+d.x:(d.b&&sg.kg>0?'+':'')+fmt(sg.kg)+' kg'} · `:'';
  out+=`<li><span>${esc(d.n)}<br><small class="${sg.tone==='up'?'sg':'muted'}">${esc(sg.note)}</small></span><span>${kg}${d.s}×${tgt(d)}</span></li>`}return out}

function spark(vals){vals=vals.filter(v=>v!=null);if(vals.length<2||vals.every(v=>!v))return '';const W=100,H=28,mn=Math.min(...vals),mx=Math.max(...vals);const X_=i=>i/(vals.length-1)*W,Y=v=>H-3-((v-mn)/((mx-mn)||1))*(H-6);const d=vals.map((v,i)=>`${i?'L':'M'}${X_(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');return `<svg class="spk" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="a" d="${d}L${W},${H}L0,${H}Z"/><path d="${d}" vector-effect="non-scaling-stroke"/></svg>`}
function secsOf(t){t=String(t);let s=0;const m=t.match(/(\d+(?:[.,]\d+)?)\s*min/);if(m)s=Math.round(num(m[1])*60);else{const x=t.match(/(\d+)\s*s\b/);if(x)s=+x[1]}if(s&&/por lado/.test(t))s*=2;return s}

function mobLevel(d){const m=dayDoc(d).mob||[];if(m.length>=MOB.length)return 2;return MOB.every((x,i)=>!x.k||m.includes(i))?1:0}
function mobStreak(){let k=0;const d=new Date();if(!mobLevel(isoDay(d)))d.setDate(d.getDate()-1);while(mobLevel(isoDay(d))&&k<400){k++;d.setDate(d.getDate()-1)}return k}

function prevStr(d,s){if(!s)return '—';const r=`${s.r}${d.u==='seg'?'s':d.u==='m'?'m':''}`;if(d.x)return `${fmt(s.kg)}${d.x}×${r}`;if(d.nk)return r;return d.b?(s.kg?`${s.kg>0?'+':''}${fmt(s.kg)}×${r}`:`BW×${r}`):`${fmt(s.kg)}×${r}`}
function rowHtml(w,e,i,s,j,lp,best,bw){

function viewActive(){

function exFromDef(d){const sg=suggest(d);const{n,s,lo,hi,rest,inc,u,b,nk,side,amrap,low,x,rpe,c}=d;return{n,s,lo,hi,rest,inc,u,b,nk,side,amrap,low,x,rpe,c,sug:sg,sets:Array.from({length:s},()=>({kg:sg.kg!=null&&!nk?String(sg.kg):'',r:'',rpe:'',done:false}))}}

function onCheck(i,j){
  const w=S.active,e=w.ex[i],s=e.sets[j];
  if(s.done){s.done=false;saveActive();render();return}
  if(!s.r){const lp=lastPerf(e.n,w.start);const v=lp&&lp.e.sets[j]&&!e.low&&!e.amrap?lp.e.sets[j].r:(e.amrap||e.low||e.lo==null?null:e.lo);if(v==null){toast(`Anota ${e.u==='seg'?'el tiempo':'las reps'} de ${e.n} primero`);$('#r-'+i+'-'+j)?.focus();return}s.r=String(v)}
  if(!s.kg&&!e.nk&&e.sug&&e.sug.kg!=null)s.kg=String(e.sug.kg);
  s.done=true;
  const b=e.c&&(w.blocks||{})[e.c];
  if(b&&b.work){}                                   // circuito por intervalos: lo maneja el temporizador

  }else if(e.rest>0){const last=j===e.sets.length-1&&i===w.ex.length-1;if(!last)startRest(e.rest,j<e.sets.length-1?`${e.n} · serie ${j+2}`:`sigue ${w.ex[i+1].n}`)}

}
function finishWorkout(){
  stopIv();

  const ex=w.ex.map(e=>{const{sug,sets,s,...meta}=e;return{...meta,sets:sets.filter(x=>x.done&&(num(x.r)||0)>0).map(x=>({kg:e.nk?0:(num(x.kg)||0),r:num(x.r),rpe:num(x.rpe)}))}}).filter(e=>e.sets.length);

  Object.keys(sess).forEach(k=>sess[k]===undefined&&delete sess[k]);sess.ex.forEach(e=>Object.keys(e).forEach(k=>e[k]===undefined&&delete e[k]));

    else if(k==='x'){const m=Math.max(...e.sets.map(s=>s.kg));if(m>b.xv&&b.xv>0)prs.push(`${e.n}: ${fmt(m)} ${e.x}`)}
    else if(b.val!=null){const vals=e.sets.map(s=>s.r);const m=e.low?Math.min(...vals):Math.max(...vals);if(e.low?m<b.val:m>b.val)prs.push(`${e.n}: ${fmt(m)}${unitS(e)}${e.low?' (más rápido)':''}`)}}
  sess.prs=prs.length;
  saveSession(sess);S.active=null;ui.discard=false;saveActive(true);stopWake();rest=null;drawBar();

    <div class="grid3"><div class="tile"><div class="lbl">Duración</div><div class="v">${sess.dur}′</div><div class="d">plan ${w.dur||'—'}′</div></div><div class="tile"><div class="lbl">Series</div><div class="v">${nsets}</div></div><div class="tile"><div class="lbl">Volumen</div><div class="v">${fmtVol(sess.vol)}</div></div></div>
    ${prs.length?`<div><span class="lbl">Récords nuevos</span><ul style="margin:6px 0 0;padding-left:18px">${prs.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`:`<p class="muted" style="margin:0">Sin récords hoy. La próxima sesión trae cargas sugeridas según lo que hiciste.</p>`}
    ${protOf(todayISO())<S.settings.prot?`<p class="muted small" style="margin:0">Proteína de hoy: ${protOf(todayISO())} / ${S.settings.prot} g. Marca el post-entreno cuando lo tomes.</p>`:''}
    <button class="btn-p wide" data-act="closemodal">Listo</button></div>`;
  $('#modal').hidden=false;render();

/* ============ temporizadores: descanso e intervalos ============ */
let rest=null,iv=null,AC=null,wake=null;
function barShell(work){const el=$('#restbar');el.innerHTML=`<div class="in ${work?'work':''}" id="barIn"><div class="fill" id="restFill"></div><span id="restT"></span><span id="restL"></span>${iv?`<button data-act="iv-pause" id="ivP">Pausa</button><button data-act="iv-stop">Parar</button>`:`<button data-act="rest-15">−15</button><button data-act="rest+15">+15</button><button data-act="rest-x">Saltar</button>`}</div>`;el.hidden=false}
function startRest(sec,label,pre='Descanso'){if(iv)return;rest={end:Date.now()+sec*1000,total:sec,label,pre,done:false};barShell(false);drawBar()}
function drawBar(){
  const bar=$('#restbar');
  if(iv){const ph=iv.seq[iv.p];const left=iv.paused?iv.left:Math.max(0,Math.ceil((iv.end-Date.now())/1000));
    const ex=S.active&&S.active.ex[ph.k];const nR=S.active?(S.active.blocks[iv.bk]||{}).rounds:0;
    $('#barIn')?.classList.toggle('work',ph.t==='work');
    $('#restT').textContent=mmss(left);
    $('#restL').textContent=ph.t==='prep'?`Prepárate · ${ex?ex.n:''}`:ph.t==='work'?`Dale · ${ex?ex.n:''} · R${ph.r+1}/${nR}`:`Pausa · anota y sigue: ${ex?ex.n:''}`;
    $('#restFill').style.width=(100*(1-left/ph.d))+'%';return}
  if(!rest){bar.hidden=true;return}
  const left=Math.max(0,Math.ceil((rest.end-Date.now())/1000));
  if($('#restT')){$('#restT').textContent=left?mmss(left):'¡Vamos!';$('#restL').textContent=(rest.pre||'Descanso')+' · '+rest.label;$('#restFill').style.width=(100*(1-left/rest.total))+'%'}
  if(!left&&!rest.done){rest.done=true;alarm();setTimeout(()=>{if(rest&&rest.done){rest=null;drawBar()}},6000)}
}
function startIv(bk){
  const w=S.active,b=w.blocks[bk];const idx=w.ex.map((e,k)=>e.c===bk?k:-1).filter(k=>k>=0);if(!idx.length)return;
  const rounds=Math.max(...idx.map(k=>w.ex[k].sets.length));const seq=[{t:'prep',d:10,k:idx[0],r:0}];
  for(let r=0;r<rounds;r++)idx.forEach((k,n)=>{if(w.ex[k].sets[r])seq.push({t:'work',d:b.work,k,r});const last=r===rounds-1&&n===idx.length-1;if(!last){const nk=n+1<idx.length?idx[n+1]:idx[0];seq.push({t:'off',d:b.off+(n+1<idx.length?0:(b.rest||0)),k:nk,r:n+1<idx.length?r:r+1})}});
  rest=null;iv={bk,seq,p:0,end:Date.now()+10000,paused:false,beeped:-1};barShell(true);drawBar();focusEx(idx[0]);
}
function focusEx(k){document.querySelectorAll('.ex.cur').forEach(x=>x.classList.remove('cur'));const el=$('#ex-'+k);if(el){el.classList.add('cur');el.scrollIntoView({block:'center',behavior:'smooth'})}}
function ivTick(){
  if(!iv||iv.paused)return;const left=Math.ceil((iv.end-Date.now())/1000);
  if(left<=3&&left>0&&iv.beeped!==left){iv.beeped=left;beep(660,.08)}
  if(Date.now()<iv.end)return;
  const ph=iv.seq[iv.p];
  if(ph.t==='work')autoMark(ph.k,ph.r);
  iv.p++;iv.beeped=-1;
  if(iv.p>=iv.seq.length){stopIv();alarm();toast('Circuito terminado · anota las reps AMRAP que falten');saveActive();render();return}
  const nx=iv.seq[iv.p];iv.end=Date.now()+nx.d*1000;beep(nx.t==='work'?1040:520,.25);if(nx.t==='work'||nx.t==='off')focusEx(nx.k);
}
function autoMark(k,r){const e=S.active.ex[k],s=e&&e.sets[r];if(!s||s.done)return;if(!s.r&&!e.amrap&&e.lo!=null)s.r=String(e.lo);if(!s.r)return;s.done=true;const tr=$('#row-'+k+'-'+r);if(tr){tr.classList.add('ok');$('#chk-'+k+'-'+r).textContent='✓';const inp=$('#r-'+k+'-'+r);if(inp)inp.value=s.r}saveActive()}

async function startWake(){try{if(navigator.wakeLock&&document.visibilityState==='visible')wake=await navigator.wakeLock.request('screen')}catch{wake=null}}

  <section class="card"><div class="row between"><span class="lbl">Movilidad · 14 días</span><span class="chip ${mobStreak()?'good':''}">${days.filter(d=>mobLevel(d)===2).length} completas · ${days.filter(d=>mobLevel(d)===1).length} mínimas · racha ${mobStreak()}</span></div>${mobDots()}</section>
  <section class="card"><span class="lbl">Sensaciones · promedio últimas ${fs.length||0} sesiones</span>
    ${fs.length?`<div class="grid3">${FEEL.map(([k,l])=>`<div class="tile"><div class="lbl">${l==='Rendimiento'?'Rendim.':l}</div><div class="v">${fmt(favg(k))}</div><div class="d">de 5</div></div>`).join('')}</div>${favg('fat')>=4&&favg('perf')<=2.5?'<p class="small" style="margin:0;color:var(--warn)">Fatiga alta con rendimiento bajo: considera una semana de descarga (−30 % volumen).</p>':''}`:'<p class="empty">Califica fatiga, ánimo y rendimiento al final de cada sesión.</p>'}</section>
  <section class="card"><div class="row between"><span class="lbl">Peso corporal · media 7 días</span>${S.body.length?`<span class="mono">${fmt(S.body[S.body.length-1].kg)} kg</span>`:''}</div>
    ${bwPts.length?lineChart(bwPts,{avg}):'<p class="empty">Registra tu peso en «Hoy» para ver la tendencia.</p>'}
    ${S.body.length?`<table class="rec"><tbody>${S.body.slice(-5).reverse().map(e=>`<tr><td>${fmtDay(e.date)} <button class="btn-s btn-g" data-act="rmbw" data-d="${e.date}" aria-label="Borrar registro">×</button></td><td>${fmt(e.kg)} kg</td></tr>`).join('')}</tbody></table>`:''}</section>`;
}

/* ============ AJUSTES ============ */
const FLAGS=e=>[e.b&&!e.nk?'bw':'',e.nk?'sin-carga':'',e.u!=='reps'?e.u:'',e.side?'lado':'',e.amrap?'amrap':'',e.low?'menos':'',e.x?'x:'+e.x:'',e.rpe?'rpe'+e.rpe:'',e.c?'@'+e.c:''].filter(Boolean).join(' ');
function tplToText(t){const bl=Object.entries(t.blocks||{}).map(([k,b])=>`# ${k} | ${b.label} | ${b.rounds} | ${b.rest||0}${b.work?` | ${b.work}/${b.off}`:''}`);const ex=t.ex.map(e=>[e.n,`${e.s}x${e.amrap?'amrap':e.lo==null?'?':e.lo===e.hi?e.lo:e.lo+'-'+e.hi}`,e.rest,`+${e.inc}`,FLAGS(e)].filter(x=>x!=='').join(' | '));return [...bl,...ex].join('\n')}
function textToTpl(txt){const blocks={},ex=[];for(const raw of txt.split('\n')){const l=raw.trim();if(!l)continue;const p=l.replace(/^#\s*/,'').split('|').map(x=>x.trim());
  if(l.startsWith('#')){const[wk,of]=(p[4]||'').split('/').map(Number);blocks[p[0]]={label:p[1]||p[0],rounds:+p[2]||0,rest:+p[3]||0,...(wk?{work:wk,off:of||0}:{})};continue}
  const m=(p[1]||'3x8-12').match(/(\d+)\s*x\s*(amrap|\?|\d+)(?:\s*-\s*(\d+))?/i)||[0,3,8,12];const f=(p[4]||'').split(/\s+/).map(x=>x.toLowerCase());
  const lo=/^\d+$/.test(m[2])?+m[2]:null,hi=lo==null?null:+(m[3]||m[2]);const o={u:f.includes('seg')?'seg':f.includes('m')?'m':'reps'};
  if(f.includes('bw'))o.b=1;if(f.includes('sin-carga')){o.b=1;o.nk=1}if(f.includes('lado'))o.side=1;if(/amrap/i.test(m[2]))o.amrap=1;if(f.includes('menos'))o.low=1;
  const xf=f.find(x=>x.startsWith('x:'));if(xf)o.x=xf.slice(2);const rf=f.find(x=>/^rpe\d/.test(x));if(rf)o.rpe=num(rf.slice(3));const cf=f.find(x=>x.startsWith('@'));if(cf)o.c=p[4].split(/\s+/).find(x=>x.startsWith('@')).slice(1);
  ex.push(X(p[0],+m[1],lo,hi,+(p[2]||90),{...o,inc:num((p[3]||'+2.5').replace('+',''))??2.5}))}return{blocks,ex}}
function viewAj(){
  const st=S.settings;
  const tpls=Object.entries(S.templates).map(([k,t])=>`<div class="card tpl-ed"><div class="row between"><h3>${esc(t.name)}</h3><span class="row" style="gap:6px"><span class="chip">${t.place==='casa'?'Casa':'CIT'}</span><span class="chip">${t.day==null?'libre':DIA[t.day]}</span><span class="chip">${t.dur||'—'}′</span></span></div>
    ${ui.tplOpen===k?`<label class="lbl" for="tpl-${k}">Una línea por ejercicio: Nombre | series x reps-tope | descanso s | +kg | marcas</label>
    <p class="muted small" style="margin:0">Marcas: bw (suma peso corporal) · sin-carga · seg · m · lado · amrap · menos (tiempo: menos es mejor) · x:cm · rpe7 · @B2 (bloque). Bloques: # B2 | Nombre | rondas | descanso entre rondas | 40/20</p>
    <textarea id="tpl-${k}">${esc(tplToText(t))}</textarea>
    <div class="grid3"><div><label class="lbl" for="tday-${k}">Día</label><select id="tday-${k}">${['',1,2,3,4,5,6,0].map(d=>`<option value="${d}" ${String(t.day??'')===String(d)?'selected':''}>${d===''?'Libre':DIA[d]}</option>`).join('')}</select></div>
    <div><label class="lbl" for="tpl-pl-${k}">Lugar</label><select id="tpl-pl-${k}"><option value="gym" ${t.place!=='casa'?'selected':''}>CIT</option><option value="casa" ${t.place==='casa'?'selected':''}>Casa</option></select></div>
    <div><label class="lbl" for="tpl-du-${k}">Minutos</label><input id="tpl-du-${k}" type="number" value="${t.dur||''}"></div></div>
    <label class="lbl" for="tpl-wu-${k}">Calentamiento</label><input id="tpl-wu-${k}" value="${esc(t.warm||'')}">
    <div class="row"><button class="btn-p btn-s" data-act="tplsave" data-k="${k}">Guardar</button><button class="btn-s btn-g" data-act="tplclose">Cerrar</button></div>`
    :`<div class="muted small">${t.ex.map(e=>esc(e.n)).join(' · ')}</div><div><button class="btn-s" data-act="tplopen" data-k="${k}">Editar</button></div>`}</div>`).join('');
  return `
  <section><h2>Ajustes</h2>
  <div class="card">
    <div class="grid3">
      <div><label class="lbl" for="stT">Meta / semana</label><input id="stT" data-f="set" data-k="target" type="number" min="1" max="7" value="${st.target}"></div>
      <div><label class="lbl" for="stM">Mínimo</label><input id="stM" data-f="set" data-k="min" type="number" min="1" max="7" value="${st.min}"></div>
      <div><label class="lbl" for="stB">Peso base kg</label><input id="stB" data-f="set" data-k="bw" type="number" step="0.1" value="${st.bw}"></div>
    </div>
    <div class="grid3">
      <div><label class="lbl" for="stP">Proteína g/día</label><input id="stP" data-f="set" data-k="prot" type="number" value="${st.prot}"></div>
      <div style="grid-column:span 2"><label class="lbl" for="stSt">Inicio del programa (semana 1)</label><input id="stSt" data-f="start" type="date" value="${st.start}"></div>
    </div>
    <label class="check" for="stS"><input id="stS" data-f="sound" type="checkbox" ${st.sound?'checked':''}> Sonido y vibración en descansos e intervalos</label>
    <p class="muted small" style="margin:0">Semana ${progWeek()} del programa. El peso base se usa para el 1RM de ejercicios con peso corporal si no te pesaste esa semana.</p>
  </div></section>
  <section><h2>Comidas</h2><div class="card"><label class="lbl" for="mealsTx">Una línea por comida: Nombre | proteína g | descripción</label>
    <textarea id="mealsTx">${esc(st.meals.map(m=>`${m.n} | ${m.g} | ${m.d||''}`).join('\n'))}</textarea>
    <div class="row between"><span class="muted small">Total del plan: ${st.meals.reduce((t,m)=>t+m.g,0)} g</span><button class="btn-s btn-p" data-act="mealsave">Guardar comidas</button></div></div></section>
  <section><div class="row between"><h2>Plantillas</h2><button class="btn-s btn-g" data-act="tplreset">Restaurar programa v2</button></div>${tpls}</section>
  <section><h2>Datos</h2><div class="card">
    <div class="row"><button data-act="exp-json">Exportar respaldo (JSON)</button><button data-act="exp-csv">Exportar series (CSV)</button></div>
    <label class="lbl" for="impFile">Importar respaldo JSON</label><input id="impFile" type="file" accept="application/json,.json">
    <p class="muted small" style="margin:0">${S.sessions.length} sesiones · ${S.body.length} pesos · ${Object.keys(S.daily).length} días de nutrición. ${DB?'Guardado en tu cuenta (celular y PC) con copia en este navegador.':'Guardado solo en este navegador.'}</p>
  </div></section>`;
}

/* ============ render ============ */
const VIEWS={hoy:viewHoy,hist:viewHist,prog:viewProg,aj:viewAj};
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===ui.tab?'page':'false'));
  const d=new Date();$('#today').textContent=`${DIA[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]} · semana ${progWeek()}`;const wcN=weekCounts(1)[0].count,Tg=S.settings.target;$('#ringC').style.strokeDashoffset=String(138.2*(1-Math.min(1,wcN/Tg)));$('#ringT').textContent=`${wcN}/${Tg}`;
  $('#view').innerHTML=VIEWS[ui.tab]();tick();
}
function softRender(){const a=document.activeElement;if(ui.tab==='hoy'&&S.active)return;if(a&&$('#view').contains(a)&&a.matches('input,textarea,select'))return;render()}

/* ============ exportar / importar ============ */
async function saveFile(filename,data){let dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch{}if(!dl){try{const u=URL.createObjectURL(new Blob([data]));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch{toast('La descarga no está disponible en esta vista')}return}try{await dl.save({filename,data})}catch(e){if(e&&e.code!=='cancelled'&&e.code!=='declined')toast('No se pudo descargar el archivo')}}
function exportJSON(){saveFile(`toji-respaldo-${todayISO()}.json`,JSON.stringify({v:2,exported:new Date().toISOString(),sessions:S.sessions,body:S.body,daily:S.daily,templates:S.templates,settings:S.settings},null,1))}
function exportCSV(){const rows=[['fecha','sesion','lugar','ejercicio','serie','carga','resultado','unidad','rpe','peso_corporal','fatiga','animo','rendimiento']];for(const s of S.sessions){const f=s.feel||{};for(const e of s.ex)e.sets.forEach((x,j)=>rows.push([s.date,s.name,s.place||'',e.n,j+1,e.nk?'':e.x?`${x.kg}${e.x}`:e.b?`BW${x.kg>=0?'+':''}${x.kg}`:x.kg,x.r,e.u,x.rpe??'',s.bw??'',f.fat??'',f.animo??'',f.perf??'']))}saveFile(`toji-series-${todayISO()}.csv`,rows.map(r=>r.map(c=>/[",;\n]/.test(String(c))?`"${String(c).replace(/"/g,'""')}"`:c).join(',')).join('\n'))}
function importJSON(file){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);let n=0,b=0;(d.sessions||[]).forEach(s=>{if(s&&s.id&&s.ex&&!S.sessions.some(x=>x.id===s.id)){saveSession(s);n++}});(d.body||[]).forEach(e=>{if(e&&e.date&&e.kg&&!S.body.some(x=>x.date===e.date)){saveBody(e);b++}});Object.entries(d.daily||{}).forEach(([k,v])=>{if(!S.daily[k]){S.daily[k]=v;saveDaily(k)}});if(d.templates){S.templates=enrich(d.templates)}if(d.settings){S.settings={...DEF_SET,...d.settings}}if(d.templates||d.settings)saveConfig();toast(`Importado: ${n} sesiones y ${b} pesos nuevos`);render()}catch{toast('El archivo no es un respaldo válido de Toji Tracker')}};fr.readAsText(file)}

/* ============ eventos ============ */
document.addEventListener('click',ev=>{
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch{}}else if(AC.state==='suspended')AC.resume().catch(()=>{});
  const tb=ev.target.closest('nav.tabs button');if(tb){ui.tab=tb.dataset.tab;ui.del=null;render();scrollTo(0,0);return}
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,i=+el.dataset.i,w=S.active;
  switch(a){
    case 'start':startWorkout(el.dataset.t);break;
    case 'phase':if(!w)break;w.phase=el.dataset.v;if(w.phase!=='cool')w.mainEnd=null;else w.mainEnd=w.mainEnd||Date.now();stopIv();saveActive();render();scrollTo(0,0);break;
    case 'tocool':w.mainEnd=w.mainEnd||Date.now();w.phase='cool';stopIv();rest=null;drawBar();saveActive();render();scrollTo(0,0);break;
    case 'wchk':{w.warmChk=w.warmChk||{};const k=el.dataset.k;w.warmChk[k]=!w.warmChk[k];saveActive();render();break}
    case 'cchk':{w.coolChk=w.coolChk||{};const k=el.dataset.k;w.coolChk[k]=!w.coolChk[k];if(el.dataset.meal&&w.coolChk[k]){const mi=S.settings.meals.findIndex(m=>/post/i.test(m.n));if(mi>=0){const td=todayISO(),doc=clone(dayDoc(td));if(!doc.m.includes(mi)){doc.m=[...doc.m,mi];S.daily[td]=doc;saveDaily(td);toast('Post-entreno sumado a tu proteína de hoy')}}}saveActive();render();break}
    case 'mob':{const td=todayISO(),doc=clone(dayDoc(td)),k=+el.dataset.k;const m=doc.mob||[];doc.mob=m.includes(k)?m.filter(x=>x!==k):[...m,k];S.daily[td]=doc;saveDaily(td);if(mobLevel(td)===2&&m.length<MOB.length)toast('Movilidad completa. Racha: '+mobStreak()+' días');render();break}
    case 'mobopen':{const lvl=mobLevel(todayISO());ui.mobOpen=!(ui.mobOpen??(lvl<2));render();break}
    case 'tmr':startRest(+el.dataset.s,el.dataset.l,'Tiempo');break;
    case 'place':S.settings.place=el.dataset.v;saveConfig();render();break;
    case 'chk':onCheck(i,+el.dataset.j);break;
    case 'addset':{const e=w.ex[i],l=e.sets[e.sets.length-1];e.sets.push({kg:l?l.kg:'',r:'',rpe:'',done:false});saveActive();render();break}
    case 'rmset':w.ex[i].sets.pop();saveActive();render();break;
    case 'rmex':w.ex.splice(i,1);stopIv();saveActive();render();break;
    case 'addex':{const n=$('#addEx').value.trim();if(!n){toast('Escribe el nombre del ejercicio');break}const def=Object.values(S.templates).flatMap(t=>t.ex).find(e=>e.n.toLowerCase()===n.toLowerCase());const lp=lastPerf(n);const base=def?{...def,c:undefined}:lp?{...lp.e,s:lp.e.sets.length,c:undefined}:X(n,3,8,12,90);w.ex.push(exFromDef(base));saveActive();render();break}
    case 'feel':{w.feel=w.feel||{};const k=el.dataset.k,v=+el.dataset.v;w.feel[k]=w.feel[k]===v?undefined:v;saveActive();render();break}
    case 'savetpl':{const t=S.templates[w.tpl];t.ex=w.ex.map(e=>{const{sug,sets,...d}=e;const o={...d,s:sets.length};Object.keys(o).forEach(k=>o[k]===undefined&&delete o[k]);return o});saveConfig();toast(`Plantilla «${t.name}» actualizada`);break}
    case 'iv':startIv(el.dataset.b);break;
    case 'iv-pause':if(iv){if(iv.paused){iv.end=Date.now()+iv.left*1000;iv.paused=false;el.textContent='Pausa'}else{iv.left=Math.max(0,Math.ceil((iv.end-Date.now())/1000));iv.paused=true;el.textContent='Seguir'}}break;
    case 'iv-stop':stopIv();break;
    case 'finish':finishWorkout();break;
    case 'discard':ui.discard=true;render();break;
    case 'discard-no':ui.discard=false;render();break;
    case 'discard-yes':stopIv();S.active=null;ui.discard=false;saveActive(true);stopWake();rest=null;drawBar();render();toast('Sesión descartada');break;
    case 'rest-15':if(rest){rest.end-=15000;rest.done=false}drawBar();break;
    case 'rest+15':if(rest){rest.end=Math.max(rest.end,Date.now())+15000;rest.total+=15;rest.done=false}drawBar();break;
    case 'rest-x':rest=null;drawBar();break;
    case 'meal':{const td=todayISO(),doc=clone(dayDoc(td)),k=+el.dataset.k;doc.m=doc.m.includes(k)?doc.m.filter(x=>x!==k):[...doc.m,k];S.daily[td]=doc;saveDaily(td);render();break}
    case 'protx':{const v=num($('#protX').value);if(!v||v<0||v>300){toast('Ingresa gramos de proteína');break}const td=todayISO(),doc=clone(dayDoc(td));doc.x=(doc.x||0)+Math.round(v);S.daily[td]=doc;saveDaily(td);render();break}
    case 'protx0':{const td=todayISO(),doc=clone(dayDoc(td));doc.x=0;S.daily[td]=doc;saveDaily(td);render();break}
    case 'bw':{const v=num($('#bwIn').value);if(!v||v<30||v>250){toast('Ingresa un peso válido en kg');break}saveBody({date:todayISO(),kg:r1(v)});toast('Peso guardado');render();break}
    case 'rmbw':deleteBody(el.dataset.d);render();break;
    case 'open':if(ev.target.closest('button'))break;ui.open=ui.open===el.dataset.id?null:el.dataset.id;ui.del=null;render();break;
    case 'del':ui.del=el.dataset.id;render();break;
    case 'del-no':ui.del=null;render();break;
    case 'del-yes':deleteSession(el.dataset.id);ui.del=null;ui.open=null;render();toast('Sesión borrada');break;
    case 'repeat':repeatSession(el.dataset.id);break;
    case 'closemodal':$('#modal').hidden=true;break;
    case 'tplopen':ui.tplOpen=el.dataset.k;render();break;
    case 'tplclose':ui.tplOpen=null;render();break;
    case 'tplsave':{const k=el.dataset.k,{blocks,ex}=textToTpl($('#tpl-'+k).value);if(!ex.length){toast('La plantilla necesita al menos un ejercicio');break}const t=S.templates[k];t.ex=ex.map(e=>{Object.keys(e).forEach(x=>e[x]===undefined&&delete e[x]);return e});t.blocks=blocks;const dv=$('#tday-'+k).value;t.day=dv===''?null:+dv;t.place=$('#tpl-pl-'+k).value;t.dur=num($('#tpl-du-'+k).value);t.warm=$('#tpl-wu-'+k).value.trim();saveConfig();ui.tplOpen=null;render();toast('Plantilla guardada');break}
    case 'tplreset':S.templates=clone(DEF_TPL);saveConfig();render();toast('Programa v2 restaurado');break;
    case 'mealsave':{const ms=$('#mealsTx').value.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(p=>p[0]).map(p=>({n:p[0],g:num(p[1])||0,d:p[2]||''}));if(!ms.length){toast('Agrega al menos una comida');break}S.settings.meals=ms;saveConfig();render();toast('Comidas guardadas');break}
    case 'exp-json':exportJSON();break;
    case 'exp-csv':exportCSV();break;
  }
});
document.addEventListener('input',ev=>{
  const el=ev.target,f=el.dataset.f;if(!f)return;
  if(f==='kg'||f==='r'){S.active.ex[+el.dataset.i].sets[+el.dataset.j][f]=el.value;saveActive()}
  else if(f==='notes'){S.active.notes=el.value;saveActive()}
  else if(f==='set'){const v=num(el.value);if(v){S.settings[el.dataset.k]=v;saveConfig()}}
});
document.addEventListener('change',ev=>{
  const el=ev.target,f=el.dataset.f;
  if(f==='rpe'){S.active.ex[+el.dataset.i].sets[+el.dataset.j].rpe=el.value;saveActive()}
  else if(f==='exsel'){ui.ex=el.value;LS.set('exSel',ui.ex);render()}
  else if(f==='sound'){S.settings.sound=el.checked;saveConfig()}
  else if(f==='start'){if(el.value){S.settings.start=el.value;saveConfig();render()}}
  else if(f==='warm'){S.active.warmDone=el.checked;saveActive()}
  else if(f==='cr'||f==='ag'){const td=todayISO(),doc=clone(dayDoc(td));doc[f]=el.checked;S.daily[td]=doc;saveDaily(td)}
  else if(el.id==='impFile'&&el.files[0])importJSON(el.files[0]);
  else if(f==='set')render();
});
document.addEventListener('keydown',ev=>{if(ev.target.classList&&ev.target.classList.contains('td')&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();ev.target.click();return}if(ev.key==='Enter'&&ev.target.id==='bwIn')$('[data-act="bw"]').click();if(ev.key==='Enter'&&ev.target.id==='protX')$('[data-act="protx"]').click();if(ev.key==='Enter'&&ev.target.id==='addEx')$('[data-act="addex"]').click()});

render();if(S.active)startWake();connect();
</script>
